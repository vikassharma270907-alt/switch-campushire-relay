name: Antigravity CI / CD Quality Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  verify:
    name: Master Quality Gate (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f campushire-relay/requirements.txt ]; then pip install -r campushire-relay/requirements.txt; fi

      - name: Syntax & Compilation Validation
        shell: bash
        run: |
          python -m compileall -q switch_agent campushire-relay scripts tests

      - name: Run Master Verification Suite (96 Tests + 62 Governance Tests)
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          python run_all_tests.py

      - name: Run End-to-End Subsystems Verification (13 Subsystems)
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          python scripts/e2e_platform_verify.py
